<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Not Found - Slot 36</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center">
    <div class="card shadow-sm mx-auto p-5" style="max-width: 500px;">
        <i class="bi bi-exclamation-triangle text-warning display-1 mb-3"></i>
        <h2 class="fw-bold text-dark">Resource Not Found</h2>
        <p class="text-secondary mt-2" th:text="${errorMessage}">The requested product could not be found.</p>
        <div class="mt-4">
            <a th:href="@{/products}" class="btn btn-primary"><i class="bi bi-arrow-left me-1"></i>Back to Products</a>
        </div>
    </div>
</div>
</body>
</html>
