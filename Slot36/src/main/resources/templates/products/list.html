<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management - Slot 36</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products"><i class="bi bi-box-seam me-2"></i>SBA301 - Slot 36</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white active" href="/products">Products</a>
            <a class="nav-link text-white-50" href="/products/create">+ Add Product</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold text-dark mb-0">Product Catalog</h2>
        <a th:href="@{/products/create}" class="btn btn-success"><i class="bi bi-plus-circle me-1"></i>New Product</a>
    </div>

    <!-- Flash Success Message -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Search Bar -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/products}" method="get" class="row g-2">
                <div class="col-md-9">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search products by name...">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Search</button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Products Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th style="width: 15%;">ID</th>
                        <th style="width: 35%;">Name</th>
                        <th style="width: 20%;">Category</th>
                        <th style="width: 15%;">Price</th>
                        <th style="width: 15%;" class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="5" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-1"></i>No products found matching the criteria.
                        </td>
                    </tr>
                    <tr th:each="p : ${products}">
                        <td class="fw-semibold text-secondary" th:text="${p.id}"></td>
                        <td class="fw-bold" th:text="${p.name}"></td>
                        <td><span class="badge bg-info text-dark" th:text="${p.category}"></span></td>
                        <td class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}"></td>
                        <td class="text-center">
                            <div class="d-inline-flex gap-1">
                                <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning" title="Edit">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this product?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
