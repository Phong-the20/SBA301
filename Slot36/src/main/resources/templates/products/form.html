<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id == null ? 'Create Product - Slot 36' : 'Edit Product - Slot 36'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/products"><i class="bi bi-box-seam me-2"></i>SBA301 - Slot 36</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white-50" href="/products">Products</a>
            <a class="nav-link text-white active" href="/products/create">+ Add Product</a>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 650px;">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white py-3">
            <h4 class="mb-0 fw-bold" th:text="${product.id == null ? 'New Product' : 'Edit Product'}"></h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/products/save}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}">

                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Enter product name">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                    <select th:field="*{category}" class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                        <option value="">-- Select Category --</option>
                        <option value="ACCESSORY">ACCESSORY</option>
                        <option value="DISPLAY">DISPLAY</option>
                        <option value="STORAGE">STORAGE</option>
                        <option value="BOOK">BOOK</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{category}"></div>
                </div>

                <!-- Price -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Price ($) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" placeholder="0.00">
                    <div class="invalid-feedback" th:errors="*{price}"></div>
                </div>

                <!-- Active status -->
                <div class="mb-4 form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" th:field="*{active}" id="activeSwitch">
                    <label class="form-check-label fw-semibold" for="activeSwitch">Active in Catalog</label>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                        <i class="bi bi-save me-1"></i>Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
