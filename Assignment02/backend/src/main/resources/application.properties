spring.application.name=A2TranThePhong_SE1910
server.port=8080

# MS SQL Server DataSource
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A2TranThePhong_SE1910;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true
server.error.include-message=always

